<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV'de Bugün Hangi Maç Var?</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a1a1a; font-size: 24px; margin-bottom: 5px; }
        .update-time { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; font-style: italic; }
        .match-card { display: flex; align-items: center; border-bottom: 1px solid #e4e6eb; padding: 15px 0; transition: 0.2s; }
        .match-card:hover { background-color: #f8f9fa; border-radius: 8px; }
        .match-card:last-child { border-bottom: none; }
        .time { font-weight: 800; font-size: 18px; color: #e63946; width: 65px; text-align: center;}
        .details { flex-grow: 1; padding-left: 15px; }
        .match-name { font-size: 15px; font-weight: bold; color: #1d3557; margin-bottom: 4px; }
        .channel { font-size: 13px; color: #457b9d; display: inline-block; background: #e0fbfc; padding: 4px 8px; border-radius: 6px; font-weight: 600;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 Günün Maç Rehberi</h1>
        <div class="update-time" id="updateTime">Veriler güncelleniyor... Lütfen bekleyin.</div>
        <div id="matchList"></div>
    </div>

    <script>
        // Oluşan api.json dosyasından verileri alıyoruz
        fetch('api.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerText = "Son Güncelleme: " + data.guncellenme_tarihi;
                
                const matchList = document.getElementById('matchList');
                matchList.innerHTML = ""; 
                
                // Eğer maç yoksa
                if(data.toplam_mac === 0){
                    matchList.innerHTML = "<p style='text-align:center;'>Şu an için güncel maç bulunamadı.</p>";
                    return;
                }

                // Maçları listele
                data.mac_listesi.forEach(mac => {
                    const card = `
                        <div class="match-card">
                            <div class="time">${mac.saat}</div>
                            <div class="details">
                                <div class="match-name">${mac.mac}</div>
                                <div class="channel">📺 ${mac.kanal}</div>
                            </div>
                        </div>
                    `;
                    matchList.innerHTML += card;
                });
            })
            .catch(error => {
                document.getElementById('matchList').innerHTML = "<p style='text-align:center; color:red;'>Veriler çekilirken hata oluştu. (Sistem birazdan güncellenecektir)</p>";
            });
    </script>
</body>
</html>
